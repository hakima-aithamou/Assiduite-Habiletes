 },\n  { c: \"T\", nom: \"Très bien\", l: 3 },\n  { c: \"S\", nom: \"Satisfaisant\", l: 2 },\n  { c: \"N\", nom: \"Amélioration nécessaire\", l: 1 }\n];\nconst coteDe = c => COTES.find(x => x.c === c) || null;\nconst coteTexte = c => { const k = coteDe(c); return k ? k.c + \" – \" + k.nom : \"\"; };\nconst estMois = t => /^(Janvier|Février|Mars|Avril|Mai|Juin|Juillet|Août|Septembre|Octobre|Novembre|Décembre) \\d{4}$/.test(t || \"\");\nconst rangMois = t => { const [m, a] = t.split(\" \"); return +a * 12 + MOIS.indexOf(m); };\nconst dateLongue = t => { if (!t) return \"\"; const [y, m, d] = t.split(\"-\").map(Number); return new Date(y, m - 1, d).toLocaleDateString(\"fr-CA\", { day: \"numeric\", month: \"long\", year: \"numeric\" }); };\n\n/* ===== Grille d'origine : 7 habiletés ===== */\nconst ORIGINE = [\n  { id: \"fr\", titre: \"Utilisation du français\",\n    ind: [\"J'utilise toujours le français pour communiquer avec mes enseignants et mes camarades.\",\"J'utilise les termes justes et appropriés selon le sujet étudié.\",\"Je construis des phrases complètes et bien structurées à l'oral comme à l'écrit.\",\"Je relis mes phrases pour corriger les fautes de grammaire ou d'orthographe.\",\"Je fournis des efforts pour m'exprimer clairement et avec politesse.\",\"Je pose mes questions et je demande des renseignements en français.\",\"Je fais des efforts pour enrichir mon vocabulaire et bien prononcer les mots.\"],\n    prof: { E: \"Communique toujours en français avec l'enseignant et ses pairs, emploie un vocabulaire juste et des phrases bien structurées, et corrige ses erreurs de lui-même.\", T: \"Communique presque toujours en français, emploie généralement les bons termes et des phrases complètes, avec peu de rappels.\", S: \"Communique souvent en français, mais a besoin de rappels ; vocabulaire et phrases parfois imprécis.\", N: \"Communique rarement en français malgré les rappels ; vocabulaire limité et phrases souvent incomplètes.\" },\n    eleve: { E: \"Je communique toujours en français, j'emploie les bons termes et des phrases bien construites, et je corrige mes erreurs moi-même.\", T: \"Je communique presque toujours en français et j'emploie généralement les bons termes, avec peu de rappels.\", S: \"Je communique souvent en français, mais j'ai besoin de rappels ; mes mots et mes phrases sont parfois imprécis.\", N: \"Je communique rarement en français, même après des rappels ; mes phrases sont souvent incomplètes.\" } },\n  { id: \"fi\", titre: \"Fiabilité\",\n    ind: [\"Je respecte mes engagements et les délais fixés.\",\"Je fais preuve de constance dans la qualité de mon travail.\",\"Je reconnais mes erreurs et j'essaie de les corriger.\",\"Je rends mes travaux complets et bien présentés.\"],\n    prof: { E: \"Respecte toujours ses engagements et les échéances ; remet des travaux complets, soignés et de qualité constante.\", T: \"Respecte presque toujours ses engagements et les échéances ; travaux généralement complets et soignés.\", S: \"Respecte parfois les échéances ; travaux parfois incomplets ou de qualité inégale.\", N: \"Respecte rarement les échéances ; travaux souvent incomplets ou non remis.\" },\n    eleve: { E: \"Je respecte toujours mes engagements et les échéances ; mes travaux sont complets, soignés et de qualité constante.\", T: \"Je respecte presque toujours les échéances ; mes travaux sont généralement complets et soignés.\", S: \"Je respecte parfois les échéances ; mes travaux sont parfois incomplets ou de qualité inégale.\", N: \"Je respecte rarement les échéances ; mes travaux sont souvent incomplets ou pas remis.\" } },\n  { id: \"or\", titre: \"Sens de l'organisation\",\n    ind: [\"Je détermine les objectifs et les étapes du travail demandé.\",\"Je planifie mes tâches pour respecter les échéances.\",\"Je détermine des stratégies bien réfléchies pour atteindre les objectifs du travail demandé.\",\"Je sais prioriser mes tâches selon leur importance.\",\"Je gère mes fichiers et mes documents numériques de façon organisée.\",\"Je lis bien les consignes avant de commencer une tâche.\",\"Je vérifie que j'ai bien compris la tâche avant de la commencer.\",\"Je garde mes notes de cours bien classées et à jour.\"],\n    prof: { E: \"Planifie toujours ses tâches et leurs étapes, établit ses priorités, lit les consignes et garde ses notes et ses fichiers bien classés.\", T: \"Planifie généralement ses tâches, lit les consignes et garde ses documents assez bien organisés.\", S: \"Planifie parfois ses tâches ; a besoin d'aide pour établir ses priorités et garder ses documents en ordre.\", N: \"Planifie rarement ses tâches ; commence souvent sans lire les consignes ; notes et fichiers désorganisés.\" },\n    eleve: { E: \"Je planifie toujours mes tâches et leurs étapes, j'établis mes priorités, je lis les consignes et mes notes sont bien classées.\", T: \"Je planifie généralement mes tâches, je lis les consignes et mes documents sont assez bien organisés.\", S: \"Je planifie parfois mes tâches ; j'ai besoin d'aide pour établir mes priorités et garder mes documents en ordre.\", N: \"Je planifie rarement ; je commence souvent sans lire les consignes et mes notes sont désorganisées.\" } },\n  { id: \"au\", titre: \"Autonomie\",\n    ind: [\"Je travaille sans rappel ou surveillance.\",\"Je prends des initiatives pour résoudre mes difficultés.\",\"Je demande de l'aide seulement après avoir essayé par moi-même.\",\"Je gère efficacement mon temps de travail.\",\"Je fais preuve de persévérance dans l'exécution des tâches.\",\"Je reste concentré(e) sur mes tâches sans me laisser distraire.\",\"Je cherche des ressources (notes, exemples, vidéos, etc.) pour mieux comprendre.\",\"J'accepte les commentaires de l'enseignant pour m'améliorer.\",\"Je cherche à comprendre mes erreurs pour progresser.\"],\n    prof: { E: \"Travaille toujours sans rappel, gère bien son temps, persévère, cherche des ressources et utilise les commentaires pour progresser.\", T: \"Travaille généralement sa our chaque élève. À sa première connexion, l'élève clique sur « S'identifier » et voit son mot de passe pendant 30 secondes (une seule fois). Il sert aussi pour Assiduité.<\/div>\n    <div class=\"field\"><label for=\"aFirst\">Un élève à la fois<\/label><div class=\"inline\"><input type=\"text\" id=\"aFirst\" placeholder=\"Prénom\" maxlength=\"100\"><input type=\"text\" id=\"aLast\" placeholder=\"Nom\" maxlength=\"100\"><\/div><div><button class=\"btn primary\" data-act=\"addOne\">Ajouter l'élève<\/button><\/div><\/div>\n    <div class=\"field\"><label for=\"aList\">Ou toute la liste (Nom, Prénom — un élève par ligne)<\/label><textarea id=\"aList\" placeholder=\"Tremblay, Léa&#10;Nguyen, Marc&#10;Haddad, Sami\"><\/textarea><div><button class=\"btn\" data-act=\"addList\">Ajouter la liste<\/button><\/div><\/div>\n    ${aj && aj.some(l => l.status === \"erreur\") ? `<div class=\"msg err\">${aj.filter(l => l.status === \"erreur\").map(l => `${esc(l.first)} ${esc(l.last)} : ${esc(l.error)}`).join(\"<br>\")}<\/div>` : \"\"}\n    ${autres.length ? `<details><summary class=\"lab\" style=\"cursor:pointer\">Tes élèves des autres classes (${autres.length})<\/summary><div class=\"checks\" style=\"margin-top:8px\">${autres.map(s => `<label><input type=\"checkbox\" data-membre value=\"${esc(s.id)}\"> ${esc(s.last_name)}, ${esc(s.first_name)}<\/label>`).join(\"\")}<\/div><div class=\"actions\" style=\"margin-top:8px\"><button class=\"btn\" data-act=\"saveMembers\">Ajouter les élèves cochés<\/button><\/div><\/details>` : \"\"}\n  <\/section><section class=\"panel\"><h2>${esc(c.name)} · ${a.length} élève${a.length > 1 ? \"s\" : \"\"}<\/h2>\n    ${a.length ? `<div class=\"scroller\"><table class=\"liste\" style=\"min-width:620px\"><thead><tr><th>Nom<\/th><th>Prénom<\/th><th>Mot de passe<\/th><th><\/th><\/tr><\/thead><tbody>\n    ${a.map(s => ed === s.id ? `<tr class=\"edit\"><td><input type=\"text\" id=\"eLast\" value=\"${esc(s.last_name)}\" maxlength=\"100\"><\/td><td><input type=\"text\" id=\"eFirst\" value=\"${esc(s.first_name)}\" maxlength=\"100\"><\/td><td><input type=\"text\" id=\"ePass\" placeholder=\"Nouveau (facultatif)\" maxlength=\"128\"><\/td><td><div class=\"actions\"><button class=\"btn small primary\" data-act=\"saveEdit\" data-id=\"${esc(s.id)}\">Enregistrer<\/button><button class=\"btn small ghost\" data-act=\"cancelEdit\">Annuler<\/button><\/div><\/td><\/tr>`\n      : `<tr><td><b>${esc(s.last_name)}<\/b><\/td><td>${esc(s.first_name)}<\/td><td>${mdp(s)}<\/td><td><div class=\"actions\" style=\"justify-content:flex-end\">${del === s.id ? `<span class=\"sub\">Retirer de ${esc(c.name)}, ou supprimer le compte (aussi dans Assiduité) ?<\/span><button class=\"btn small\" data-act=\"retirer\" data-id=\"${esc(s.id)}\">Retirer de la classe<\/button><button class=\"btn small danger fill\" data-act=\"delStuOk\" data-id=\"${esc(s.id)}\">Supprimer le compte<\/button><button class=\"btn small ghost\" data-act=\"cancelDel\">Annuler<\/button>` : `<button class=\"btn small\" data-act=\"edit\" data-id=\"${esc(s.id)}\">Modifier<\/button><button class=\"btn small\" data-act=\"resetPwd\" data-id=\"${esc(s.id)}\">Nouveau mot de passe<\/button><button class=\"btn small ghost danger\" data-act=\"delStu\" data-id=\"${esc(s.id)}\">Supprimer<\/button>`}<\/div><\/td><\/tr>`).join(\"\")}\n    <\/tbody><\/table><\/div>` : '<p class=\"empty\">Aucun élève dans cette classe.<\/p>'}\n  <\/section><\/div>`;\n}\nfunction pAjouterClasse() {\n  qs(\"#page\").innerHTML = `<section class=\"panel\" style=\"max-width:560px\"><div class=\"field\"><label for=\"newClass\">Nom de la classe<\/label><input type=\"text\" id=\"newClass\" maxlength=\"100\" placeholder=\"ex. MCR3U-05\"><\/div><div class=\"actions\"><button class=\"btn primary\" data-act=\"addClass\">Créer la classe<\/button><\/div>\n    ${S.data.classes.length ? `<div class=\"sub\">Tes classes : ${S.data.classes.map(c => esc(c.name)).join(\", \")}<\/div>` : \"\"}<\/section>`;\n  qs(\"#newClass\").focus();\n}\nfunction pGererClasses() {\n  const d = S.data, del = S.ui.del;\n  if (!d.classes.length) { qs(\"#page\").innerHTML = classeChips(); return; }\n  qs(\"#page\").innerHTML = `<section class=\"panel\"><div class=\"scroller\"><table class=\"liste\" style=\"min-width:640px\"><thead><tr><th>Classe<\/th><th class=\"c\">Élèves<\/th><th class=\"c\">Mois évalués<\/th><th>Nouveau nom<\/th><th><\/th><\/tr><\/thead><tbody>\n  ${d.classes.map(a => `<tr><td><b>${esc(a.name)}<\/b><\/td><td class=\"c\">${membres(a.id).length}<\/td><td class=\"c\">${moisDeClasse(a.id).length}<\/td><td><div class=\"inline\"><input type=\"text\" id=\"ren-${esc(a.id)}\" value=\"${esc(a.name)}\" maxlength=\"100\"><button class=\"btn small\" data-act=\"renClass\" data-id=\"${esc(a.id)}\">Renommer<\/button><\/div><\/td><td><div class=\"actions\">${del === a.id ? `<span class=\"sub\">Supprimer ${esc(a.name)} ? Toutes ses évaluations seront supprimées, ici <b>et dans Assiduité<\/b>. Les comptes des élèves sont gardés.<\/span><button class=\"btn small danger fill\" data-act=\"delClassOk\" data-id=\"${esc(a.id)}\">Supprimer<\/button><button class=\"btn small ghost\" data-act=\"cancelDel\">Annuler<\/button>` : `<button class=\"btn small ghost danger\" data-act=\"delClass\" data-id=\"${esc(a.id)}\">Supprimer<\/button>`}<\/div><\/td><\/tr>`).join(\"\")}\n  <\/tbody><\/table><\/div><\/section>`;\n}\n\n/* ===== Semestre : cote la plus fréquente ; en cas d'égalité, la plus récente ===== */\nconst anScol = () => S.ui.mm.m >= 9 ? S.ui.mm.y : S.ui.mm.y - 1;\nconst SEMS = [{ n: 1, nom: \"Semestre 1\", mois: [[9, 0], [10, 0], [11, 0], [12, 0], [1, 1]] }, { n: 2, nom: \"Semestre 2\", mois: [[2, 1], [3, 1], [4, 1], [5, 1], [6, 1]] }];\nconst moisSem = (n, an) => SEMS[n - 1].mois.map(([m, d]) => MOIS[m - 1] + \" \" + (an + d));\nconst nomSem = (n, an) => `Semestre ${n} (${n === 1 ? \"sept. \" + an + \" à janv. \" + (an + 1) : \"févr. à juin \" + (an + 1)})`;\nfunction coteSem(sid, cid, hid, n, an) {\n  const suite = moisSem(n, an).map(m => ({ m, c: ligne(sid, cid, m, \"teacher\")?.cotes?.[hid] })).filter(x => x.c);\n  if (!suite.length) return null;\n  const nb = {}; suite.forEach(x => nb[x.c] = (nb[x.c] || 0) + 1);\n  const max = Math.max(...Object.values(nb));\n  let choix = null; suite.forEach(x => { if (nb[x.c] === max) choix = x.c; }); /* la dernière parmi les plus fréquentes = la plus récente */\n  return { c: choix, suite, egal: Object.values(nb).filter(v => v === max).length > 1 };\n}\nconst ABR = { Janvier: \"janv.\", Février: \"févr.\", Mars: \"mars\", Avril: \"avr.\", Mai: \"mai\", Juin: \"juin\", Juillet: \"juil.\", Août: \"août\", Septembre: \"sept.\", Octobre: \"oct.\", Novembre: \"nov.\", Décembre: \"déc.\" };\nconst detailSem = r => r ? r.suite.map(x => ABR[x.m.split(\" \")[0]] + \" \" + x.c).join(\" · \") : \"\";\n\n/* ===== Données ===== */\nfunction pDonnees() {\n  const t = qs(\"#page\"), c = cls();\n  if (!c) { t.innerHTML = classeChips(); return; }\n  const a = membres(c.id), g = grille(), gs = grille(), mois = moisDeClasse(c.id);\n  const vue = S.ui.dVue || (mois.includes(moisVu()) ? moisVu() : mois[mois.length - 1] || moisVu());\n  const estAuto = AUTOS.some(x => x.p === vue), gg = estAuto ? gs : g, an = anScol();\n  if (/^sem[12]$/.test(vue)) { pDonneesSem(c, a, g, +vue.slice(3), an); return; }\n  t.innerHTML = `<section class=\"panel\"><div class=\"toolbar\">${classeChips()}<div class=\"field\"><span class=\"lab\">Afficher<\/span><div class=\"seg\">${SEMS.map(x => `<button data-dvue=\"sem${x.n}\">${x.nom}<\/button>`).join(\"\")}${mois.map(m => `<button class=\"${vue === m ? \"on\" : \"\"}\" data-dvue=\"${esc(m)}\">${esc(m)}<\/button>`).join(\"\")}${AUTOS.map(x => `<button class=\"${vue === x.p ? \"on\" : \"\"}\" data-dvue=\"${esc(x.p)}\">${esc(x.nom)}<\/button>`).join(\"\")}<\/div>${mois.length ? \"\" : '<span class=\"sub\">Aucun mois évalué pour l\\'instant.<\/span>'}<\/div><\/div><\/section>${legende()}\n  ${a.length ? `<div class=\"tbl-wrap\"><table class=\"ecl hh donnees\"><thead><tr><th class=\"nomcol\">Élève<\/th>${gg.map((h, i) => `<th>${i + 1}. ${esc(h.titre)}<\/th>`).join(\"\")}<th>Commentaire<\/th><\/tr><\/thead><tbody>\n  ${a.map(s => { const r = ligne(s.id, c.id, vue, estAuto ? \"student\" : \"teacher\"); return `<tr><td class=\"nomcol\"><b>${esc(s.last_name)}, ${esc(s.first_name)}<\/b><\/td>${gg.map(h => `<td>${coteTxt(r?.cotes?.[h.id], estAuto)}<\/td>`).join(\"\")}<td class=\"commcell\">${esc(r?.comment || \"\")}<\/td><\/tr>`; }).join(\"\")}\n  <\/tbody><\/table><\/div><p class=\"sub\">${esc(estAuto ? autoNom(vue) : vue)} · ${a.filter(s => ligne(s.id, c.id, vue, estAuto ? \"student\" : \"teacher\")).length} élève(s) sur ${a.length}.<\/p>` : '<p class=\"empty\">Aucun élève dans cette classe.<\/p>'}`;\n}\n\nfunction pDonneesSem(c, a, g, n, an) {\n  const mois = moisDeClasse(c.id), vue = \"sem\" + n;\n  qs(\"#page\").innerHTML = `<section class=\"panel\"><div class=\"toolbar\">${classeChips()}<div class=\"field\"><span class=\"lab\">Afficher<\/span><div class=\"seg\">${SEMS.map(x => `<button class=\"${vue === \"sem\" + x.n ? \"on\" : \"\"}\" data-dvue=\"sem${x.n}\">${x.nom}<\/button>`).join(\"\")}${mois.map(m => `<button data-dvue=\"${esc(m)}\">${esc(m)}<\/button>`).join(\"\")}${AUTOS.map(x => `<button data-dvue=\"${esc(x.p)}\">${esc(x.nom)}<\/button>`).join(\"\")}<\/div><\/div><\/div>\n  <div class=\"msg info\"><b>${esc(nomSem(n, an))}<\/b> · Pour chaque habileté : la cote <b>la plus fréquente<\/b> des mois évalués ; en cas d'égalité, <b>la plus récente<\/b>. Passe la souris sur une cote pour voir le détail des mois. Pour une autre année scolaire, change l'année dans « Évaluer ».<\/div><\/section>${legende()}\n  ${a.length ? `<div class=\"tbl-wrap\"><table class=\"ecl hh donnees\"><thead><tr><th class=\"nomcol\">Élève<\/th>${g.map((h, i) => `<th>${i + 1}. ${esc(h.titre)}<\/th>`).join(\"\")}<th>Mois évalués<\/th><\/tr><\/thead><tbody>\n  ${a.map(s => { const nbm = moisSem(n, an).filter(m => ligne(s.id, c.id, m, \"teacher\")).length;\n    return `<tr><td class=\"nomcol\"><b>${esc(s.last_name)}, ${esc(s.first_name)}<\/b><\/td>${g.map(h => { const r = coteSem(s.id, c.id, h.id, n, an);\n      return `<td title=\"${esc(detailSem(r))}${r?.egal ? \" (égalité : la plus récente)\" : \"\"}\">${coteTxt(r?.c)}<span class=\"semdet\">${esc(detailSem(r))}<\/span><\/td>`; }).join(\"\")}<td class=\"c\">${nbm} / 5<\/td><\/tr>`; }).join(\"\")}\n  <\/tbody><\/table><\/div>` : '<p class=\"empty\">Aucun élève dans cette classe.<\/p>'}`;\n}\n\n/* ===== Grilles (modifiables) ===== */\nfunction pGrille(kind) {\n  if (!S.ui.ed || S.ui.ed.kind !== kind) S.ui.ed = { kind, crit: JSON.parse(JSON.stringify(grille(kind))), dirty: false };\n  const e = S.ui.ed, perso = !!S.data.grids?.[kind];\n  qs(\"#page\").innerHTML = `${S.ui.quitter ? '<div class=\"msg err\">Tu as des changements non enregistrés. <div class=\"actions\" style=\"margin-top:8px\"><button class=\"btn small primary\" data-act=\"edSave\">Enregistrer<\/button><button class=\"btn small danger\" data-act=\"edQuitter\">Quitter sans enregistrer<\/button><button class=\"btn small ghost\" data-act=\"edRester\">Rester ici<\/button><\/div><\/div>' : \"\"}\n  <div class=\"msg info\">Cette grille sert à <b>tes<\/b> évaluations mensuelles <b>et<\/b> à l'autoévaluation de tes élèves : ils voient exactement les mêmes habiletés et les mêmes descriptions.${perso ? \"\" : \" Pour l'instant, c'est la grille d'origine.\"} Si tu supprimes une habileté, ses cotes déjà données ne sont plus affichées.<\/div>\n  <div style=\"display:flex;flex-direction:column;gap:12px\">\n  ${e.crit.map((h, i) => `<div class=\"crit-ed\"><div class=\"crit-ed-top\"><span class=\"crit-num\">${i + 1}<\/span><input type=\"text\" data-ed=\"titre\" data-i=\"${i}\" value=\"${esc(h.titre)}\" maxlength=\"120\" aria-label=\"Titre de l'habileté ${i + 1}\" placeholder=\"Titre de l'habileté\"><div class=\"actions\" style=\"flex-wrap:nowrap\"><button class=\"btn small ghost\" data-act=\"edUp\" data-i=\"${i}\" ${i ? \"\" : \"disabled\"} aria-label=\"Monter\">↑<\/button><button class=\"btn small ghost\" data-act=\"edDown\" data-i=\"${i}\" ${i < e.crit.length - 1 ? \"\" : \"disabled\"} aria-label=\"Descendre\">↓<\/button><button class=\"btn small ghost danger\" data-act=\"edDel\" data-i=\"${i}\" ${e.crit.length > 1 ? \"\" : \"disabled\"}>Supprimer<\/button><\/div><\/div>\n    <div class=\"niv-ed\">${COTES.map(k => `<div class=\"field\"><label class=\"l${k.l}\" for=\"ed-${i}-${k.c}\">${k.c} · ${k.nom}<\/label><textarea id=\"ed-${i}-${k.c}\" data-ed=\"cote\" data-i=\"${i}\" data-c=\"${k.c}\" maxlength=\"500\">${esc(h.cotes[k.c])}<\/textarea><\/div>`).join(\"\")}<\/div>\n    <div class=\"field\"><label for=\"ed-${i}-ind\">Indicateurs (un par ligne, facultatif)<\/label><textarea id=\"ed-${i}-ind\" data-ed=\"ind\" data-i=\"${i}\" class=\"ind-ed\">${esc((h.ind || []).join(\"\\n\"))}<\/textarea><\/div><\/div>`).join(\"\")}\n  <\/div><div><button class=\"btn\" data-act=\"edAdd\" ${e.crit.length >= 12 ? \"disabled\" : \"\"}>+ Ajouter une habileté<\/button><\/div>\n  <div class=\"edbar\"><span class=\"status\" id=\"edStatus\">${e.dirty ? \"Changements non enregistrés\" : \"Tout est enregistré\"} · ${e.crit.length} habileté${e.crit.length > 1 ? \"s\" : \"\"}<\/span><div class=\"actions\">${perso ? `<button class=\"btn ghost\" data-act=\"edOrigine\">Revenir à la grille d'origine<\/button>` : \"\"}<button class=\"btn\" data-act=\"edAnnuler\" ${e.dirty ? \"\" : \"disabled\"}>Annuler les changements<\/button><button class=\"btn primary\" data-act=\"edSave\">Enregistrer la grille<\/button><\/div><\/div>`;\n}\nfunction edMarquer() { S.ui.ed.dirty = true; const s = qs(\"#edStatus\"); if (s) s.textContent = \"Changements non enregistrés · \" + S.ui.ed.crit.length + \" habileté(s)\"; const b = qs('[data-act=\"edAnnuler\"]'); if (b) b.disabled = false; }\n\nfunction pGrilleEleve() {\n  qs(\"#page\").innerHTML = `<div class=\"msg info\">Tes élèves remplissent <b>la même grille que forEach(s => mois.forEach(mm => { const r = ligne(s.id, c.id, mm, \"teacher\"); if (r) lignes.push([c.name, s.last_name, s.first_name, mm, ...g.map(h => coteTexte(r.cotes?.[h.id])), r.comment || \"\"]); }));\n    } else if (o.type === \"sem\") {\n      const n = o.sem || 1, an = anScol(), lm = moisSem(n, an);\n      lignes = [[\"Classe\", \"Nom\", \"Prénom\", \"Semestre\", ...g.map(h => h.titre), ...g.map(h => h.titre + \" (détail des mois)\"), \"Mois évalués\"]];\n      a.forEach(s => { const rs = g.map(h => coteSem(s.id, c.id, h.id, n, an)); lignes.push([c.name, s.last_name, s.first_name, \"S\" + n + \" \" + an + \"-\" + (an + 1), ...rs.map(r => coteTexte(r?.c)), ...rs.map(detailSem), lm.filter(x => ligne(s.id, c.id, x, \"teacher\")).length + \" / 5\"]); });\n    } else {\n      lignes = [[\"Classe\", \"Nom\", \"Prénom\", ...g.flatMap(h => [h.titre + \" (enseignant, \" + m + \")\", h.titre + \" (élève)\"]), \"Autoévaluation\"]];\n      a.forEach(s => { const r = ligne(s.id, c.id, m, \"teacher\"), au = autoChoisie(s.id, c.id, o.auto); lignes.push([c.name, s.last_name, s.first_name, ...g.flatMap(h => [coteTexte(r?.cotes?.[h.id]), coteTexte(au?.cotes?.[gs.find(x => x.id === h.id) ? h.id : \"\"])]), au ? autoNom(au.period) : \"Pas envoyée\"]); });\n    }\n    return { nom: c.name, lignes };\n  });\n}\nfunction pTelecharger() {\n  const t = qs(\"#page\");\n  if (!S.data.classes.length) { t.innerHTML = classeChips(); return; }\n  const o = S.ui.tel || (S.ui.tel = { type: \"mois\", auto: \"recente\" }), f = feuilles(), n = f[0];\n  t.innerHTML = `<section class=\"panel\"><div class=\"toolbar\">${classeChips({ tout: true })}${o.type !== \"tous\" ? moisHtml() : \"\"}<\/div><\/section><div class=\"layout\"><aside class=\"panel\">\n  <div class=\"field\"><span class=\"lab\">Contenu du fichier<\/span><div class=\"radios\">\n    <label class=\"radio\"><input type=\"radio\" name=\"ttype\" value=\"mois\" ${o.type === \"mois\" ? \"checked\" : \"\"}><div><b>Un mois<\/b><span>Les h
